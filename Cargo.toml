[package]
name = "rtotp"
version = "0.1.0"
edition = "2021"
description = "Rust one-Time Password — a terminal TOTP (RFC 6238) client"
license = "MIT"
readme = "README.md"
repository = "https://github.com/goodhee/rtotp"
keywords = ["totp", "otp", "2fa", "cli", "rfc6238"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "rtotp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
totp-rs = "5"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
